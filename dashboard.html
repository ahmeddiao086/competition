<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم المسابقة الكبرى 🕵️‍♂️</title>
    <link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-purple: #2B0A3D;
            --primary-yellow: #FFC107;
            --accent-pink: #E91E63;
            --light-bg: #F4F4F9;
            --text-dark: #1A1A1A;
            --border-dark: #111;
            --font-title: 'Lalezar', cursive;
            --font-text: 'Poppins', sans-serif;
        }

        body {
            font-family: var(--font-text);
            background-color: var(--bg-purple);
            background-image: radial-gradient(circle at 10% 20%, rgba(255, 193, 7, 0.1) 0%, transparent 20%),
                              radial-gradient(circle at 90% 80%, rgba(233, 30, 99, 0.1) 0%, transparent 20%);
            color: var(--text-dark);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .header-title {
            font-family: var(--font-title);
            color: var(--primary-yellow);
            font-size: 3rem;
            text-shadow: 3px 3px 0px var(--border-dark);
            margin-bottom: 20px;
            text-align: center;
            transform: rotate(-2deg);
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 1000px;
        }

        .card {
            background-color: #fff;
            padding: 20px;
            border-radius: 15px;
            border: 4px solid var(--border-dark);
            box-shadow: 6px 6px 0px var(--border-dark);
            position: relative;
        }

        .card-title {
            font-family: var(--font-title);
            font-size: 1.5rem;
            color: var(--accent-pink);
            margin-top: 0;
            border-bottom: 2px dashed #ccc;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--bg-purple);
            text-align: center;
            font-family: var(--font-title);
        }

        .progress-container {
            width: 100%;
            background-color: #ddd;
            border-radius: 20px;
            border: 3px solid var(--border-dark);
            height: 25px;
            margin-top: 10px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background-color: var(--primary-yellow);
            width: 0%;
            transition: width 0.5s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.8rem;
        }

        .info-row { display: flex; justify-content: space-between; margin-bottom: 10px; font-weight: 600; }
        .info-value { color: var(--accent-pink); }
        .badge { background-color: var(--accent-pink); color: white; padding: 3px 8px; border-radius: 15px; font-size: 0.8rem; border: 2px solid var(--border-dark); }

        /* تنسيق سجل النشاطات */
        .log-container {
            max-height: 250px;
            overflow-y: auto;
            background-color: #f9f9f9;
            border: 2px solid #ccc;
            border-radius: 10px;
            padding: 10px;
            margin-top: 10px;
        }
        
        .log-item {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 8px;
            border-bottom: 1px solid #eee;
            font-size: 0.9rem;
        }
        
        .log-item:last-child { border-bottom: none; }
        .log-time { color: #888; font-size: 0.8rem; white-space: nowrap; }
        .log-icon { font-size: 1.2rem; }
        .log-text { font-weight: 600; }
        
        /* ألوان حسب نوع الحدث */
        .log-correct { color: green; }
        .log-wrong { color: red; }
        .log-hint { color: #D97706; }
        .log-penalty { color: #9333EA; }

        .controls {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }

        .btn {
            background-color: var(--primary-yellow);
            color: var(--border-dark);
            border: 3px solid var(--border-dark);
            padding: 10px 20px;
            font-family: var(--font-title);
            font-size: 1.2rem;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 3px 3px 0px var(--border-dark);
            transition: transform 0.2s;
        }
        .btn:hover { transform: translateY(-2px); }
        .btn-danger { background-color: #ff4d4d; color: white; }
    </style>
</head>
<body>

    <h1 class="header-title">👀 غرفة المراقبة السريّة</h1>

    <div class="dashboard-grid">
        <!-- الحالة العامة -->
        <div class="card">
            <h2 class="card-title">مستوى التقدم 🏃‍♀️</h2>
            <div class="stat-value" id="current-step-text">السؤال 0 من 10</div>
            <div class="progress-container"><div class="progress-bar" id="progress-bar">0%</div></div>
            <p style="text-align: center; margin-top: 10px; font-weight: 600;" id="status-text">لم تبدأ بعد...</p>
        </div>

        <!-- معلومات النظام -->
        <div class="card">
            <h2 class="card-title">معلومات النظام 📱</h2>
            <div class="info-row"><span>نوع الجهاز:</span><span class="info-value" id="device-type">غير معروف</span></div>
            <div class="info-row"><span>نظام التشغيل:</span><span class="info-value" id="os-type">غير معروف</span></div>
            <div class="info-row"><span>آخر نشاط:</span><span class="info-value badge" id="last-active">لا يوجد</span></div>
        </div>
        
        <!-- سجل النشاطات الحي -->
        <div class="card" style="grid-column: 1 / -1;">
            <h2 class="card-title">سجل المراقبة الحي 🕵️‍♂️ (الإجابات، التلميحات، العقوبات)</h2>
            <div class="log-container" id="activity-log">
                <!-- ستظهر النشاطات هنا -->
                <div style="text-align: center; color: gray; padding: 20px;">في انتظار بدء المسابقة...</div>
            </div>
        </div>
    </div>

    <div class="controls">
        <button class="btn" onclick="updateDashboard()">تحديث الآن 🔄</button>
        <button class="btn btn-danger" onclick="clearData()">مسح السجل والبدء من جديد 🗑️</button>
    </div>

    <script>
        function updateDashboard() {
            let currentStep = localStorage.getItem('quiz_current_step') || 0;
            let lastActive = localStorage.getItem('quiz_last_active') || 'لم تبدأ بعد';
            
            document.getElementById('current-step-text').textContent = `السؤال ${currentStep} من 10`;
            document.getElementById('device-type').textContent = localStorage.getItem('quiz_device_type') || 'جاري التحقق...';
            document.getElementById('os-type').textContent = localStorage.getItem('quiz_os_type') || 'جاري التحقق...';
            document.getElementById('last-active').textContent = lastActive;

            let percentage = (currentStep / 10) * 100;
            document.getElementById('progress-bar').style.width = `${percentage}%`;
            document.getElementById('progress-bar').textContent = `${Math.round(percentage)}%`;

            // جلب سجل النشاطات
            let logs = JSON.parse(localStorage.getItem('quiz_activity_log') || '[]');
            let logContainer = document.getElementById('activity-log');
            
            if (logs.length > 0) {
                logContainer.innerHTML = ''; // تفريغ السجل القديم
                // عكس المصفوفة لعرض الأحدث في الأعلى
                logs.slice().reverse().forEach(log => {
                    let icon = '📝';
                    let cssClass = '';
                    
                    if(log.type === 'صحيح') { icon = '✅'; cssClass = 'log-correct'; }
                    else if(log.type === 'خطأ') { icon = '❌'; cssClass = 'log-wrong'; }
                    else if(log.type === 'تلميح') { icon = '💡'; cssClass = 'log-hint'; }
                    else if(log.type === 'عقوبة') { icon = '⏳'; cssClass = 'log-penalty'; }

                    logContainer.innerHTML += `
                        <div class="log-item">
                            <span class="log-time">[${log.time}]</span>
                            <span class="log-icon">${icon}</span>
                            <span class="log-text ${cssClass}">${log.detail}</span>
                        </div>
                    `;
                });
            }
        }

        function clearData() {
            if(confirm('هل أنت متأكد أنك تريد مسح كل السجلات للبدء من جديد؟')) {
                localStorage.clear();
                location.reload();
            }
        }

        updateDashboard();
        setInterval(updateDashboard, 2000); // تحديث كل ثانيتين لسرعة المتابعة
    </script>
</body>
</html>
